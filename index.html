<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8d8df">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ivy's Picks">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Ivy's Picks</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
      background:#fff6f7;color:#292124;text-align:center}
    .box{width:min(390px,100%);padding:30px 22px}
    img{width:118px;height:118px;border-radius:25px;object-fit:cover}
    h1{font-size:25px;margin:18px 0 8px}
    p{color:#716368;line-height:1.55;margin:0 0 20px}
    button,a.action{display:block;width:100%;border:0;border-radius:16px;padding:16px;
      font-size:17px;font-weight:750;text-decoration:none;cursor:pointer}
    #install{background:#ee8297;color:#fff}
    .secondary{margin-top:10px;background:#fff;color:#3f3538;border:1px solid #ead7db}
    #fallback{display:none;margin-top:16px;padding:16px;border-radius:16px;background:#fff;
      border:1px solid #ead7db;font-size:14px;line-height:1.55;text-align:left}
    .small{font-size:12px;color:#998b8f;margin-top:14px}
  </style>
</head>
<body>
<main class="box">
  <img src="./icon-512.png" alt="Ivy">
  <h1 id="title">Ivy's Picks</h1>
  <p id="status">설치 준비 중이에요…</p>
  <button id="install">홈 화면에 설치하기</button>
  <a class="action secondary" href="https://influencers.coupang.com/s/ivyshinydays">설치 없이 바로 보기</a>
  <div id="fallback"></div>
  <div class="small">Ivy's Picks 바로가기</div>
</main>

<script>
let deferredPrompt = null;
const installBtn = document.getElementById('install');
const status = document.getElementById('status');
const fallback = document.getElementById('fallback');

const ua = navigator.userAgent.toLowerCase();
const isAndroid = /android/.test(ua);
const isIOS = /iphone|ipad|ipod/.test(ua);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

function showFallback(){
  fallback.style.display='block';
  if(isIOS){
    fallback.innerHTML='<b>iPhone</b><br>Safari의 공유 버튼(⬆️) → <b>홈 화면에 추가</b>를 눌러주세요.';
  } else {
    fallback.innerHTML='<b>설치창이 뜨지 않는 경우</b><br>Chrome 또는 Samsung Internet의 메뉴(⋮)에서 <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 선택해주세요.<br><br>카카오톡 안에서 열었다면 메뉴에서 <b>다른 브라우저로 열기</b>를 선택해주세요.';
  }
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  status.textContent = '아래 버튼을 눌러 홈 화면에 추가하세요.';
  // Browsers require a user gesture to show the native install prompt.
  // We therefore make the install action immediately available.
});

installBtn.addEventListener('click', async () => {
  if(isStandalone){
    location.href='https://influencers.coupang.com/s/ivyshinydays';
    return;
  }
  if(deferredPrompt){
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if(choice.outcome === 'accepted'){
      status.textContent='설치가 완료되면 홈 화면에서 Ivy 아이콘을 눌러주세요.';
    }
    return;
  }
  showFallback();
});

window.addEventListener('appinstalled', () => {
  status.textContent='설치 완료 ♡ 홈 화면에서 Ivy 아이콘을 확인하세요.';
  installBtn.textContent='설치 완료 ✓';
});

if(isStandalone){
  location.replace('https://influencers.coupang.com/s/ivyshinydays');
} else if(isAndroid){
  status.textContent='홈 화면에 Ivy 바로가기를 설치할 수 있어요.';
} else if(isIOS){
  status.textContent='홈 화면에 Ivy 바로가기를 추가할 수 있어요.';
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
