<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f9dfe4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ivy's Picks">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Ivy's Picks</title>
  <style>
    :root{--pink:#f48ca0;--deep:#2a2224;--paper:#fffafa;--soft:#fdf0f2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
      background:linear-gradient(180deg,#fff7f7,#fdecee);color:var(--deep);display:grid;place-items:center;padding:24px}
    .card{width:min(430px,100%);background:rgba(255,255,255,.9);border:1px solid #f5dfe3;border-radius:30px;
      padding:30px 24px;box-shadow:0 18px 60px rgba(90,50,60,.10);text-align:center}
    .logo{width:148px;height:148px;border-radius:32px;object-fit:cover;box-shadow:0 8px 24px rgba(244,140,160,.18)}
    h1{font-family:Georgia,serif;font-size:32px;margin:20px 0 8px}
    .sub{font-size:16px;line-height:1.65;color:#65575a;margin:0 0 22px}
    button,.shop{width:100%;border:0;border-radius:18px;padding:17px 18px;font-size:17px;font-weight:750;cursor:pointer;text-decoration:none;display:block}
    #install{background:var(--pink);color:white;box-shadow:0 8px 20px rgba(244,140,160,.25)}
    .shop{margin-top:11px;background:#fff;color:#4d4043;border:1px solid #efd9de}
    .tip{display:none;text-align:left;background:var(--soft);border-radius:18px;padding:16px 17px;margin-top:16px;font-size:14px;line-height:1.65}
    .tip strong{display:block;margin-bottom:4px}
    .fine{font-size:12px;color:#8b7b7f;margin:17px 0 0}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./icon-512.png" alt="Ivy">
    <h1>Ivy's Picks ♡</h1>
    <p class="sub">Ivy의 쿠팡 추천 페이지를<br>홈 화면에서 편하게 만나보세요.</p>
    <button id="install">홈 화면에 추가하기</button>
    <a class="shop" href="https://influencers.coupang.com/s/ivyshinydays" rel="noopener">지금 구경하기 →</a>
    <div class="tip" id="iosTip">
      <strong>iPhone / iPad에서 추가하기</strong>
      브라우저의 <b>공유 ⬆️</b>를 누른 뒤 <b>‘홈 화면에 추가’</b>를 선택하고 <b>‘추가’</b>를 눌러주세요.
    </div>
    <div class="tip" id="androidTip">
      <strong>설치 창이 보이지 않나요?</strong>
      Chrome 또는 Samsung Internet 메뉴에서 <b>‘홈 화면에 추가’</b> 또는 <b>‘앱 설치’</b>를 선택해주세요.
    </div>
    <p class="fine">Happy Shopping! 🌷</p>
  </main>
<script>
let deferredPrompt=null;
const btn=document.getElementById('install');
const iosTip=document.getElementById('iosTip');
const androidTip=document.getElementById('androidTip');
const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e; btn.textContent='Ivy’s Picks 설치하기';
});
window.addEventListener('appinstalled',()=>{btn.textContent='설치 완료 ✓'; deferredPrompt=null;});

btn.addEventListener('click',async()=>{
  if(standalone){ location.href='./open.html'; return; }
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
    return;
  }
  if(isiOS){ iosTip.style.display='block'; androidTip.style.display='none'; }
  else { androidTip.style.display='block'; iosTip.style.display='none'; }
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}
</script>
</body>
</html>
